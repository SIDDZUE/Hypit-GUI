version: 2
updates:
  # Maintain npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    # Major upgrades (React 19, Tailwind 4, ESLint 10, TypeScript 7, ...)
    # need coordinated code migrations, so they are never opened
    # automatically. The weekly group batches only minor/patch updates.
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
      # 0.x libraries may break in minor bumps (per semver), so they are
      # upgraded deliberately as well.
      - dependency-name: 'monaco-editor'
      - dependency-name: 'lucide-react'
      # Requires ESLint 9+; must be upgraded together with ESLint.
      - dependency-name: 'eslint-plugin-react-refresh'
    groups:
      dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # Maintain GitHub Actions dependencies
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
