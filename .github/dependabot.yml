version: 2
updates:
  # Maintain npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    # Major upgrades (for example the next React / Tailwind / ESLint majors)
    # need coordinated code migrations, so they are never opened
    # automatically. The weekly group batches only minor/patch updates.
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
      # Still 0.x: minor bumps may break (per semver), so it is upgraded
      # deliberately.
      - dependency-name: 'monaco-editor'
      # 0.x and tightly peer-coupled to the ESLint major; upgrade alongside it.
      - dependency-name: 'eslint-plugin-react-refresh'
    groups:
      dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # Maintain GitHub Actions dependencies
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
